<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Aquarius">
  <title>Aquarius</title>
  <defs>
    <linearGradient id="aq-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- Simplified glyph for small sizes: no card, thick strokes, one wave per
       line so it stays legible down to 16px. -->
  <g fill="none" stroke="url(#aq-wave)" stroke-width="3.4"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9 q6 -5 12 0 t12 0"/>
    <path d="M4 16 q6 -5 12 0 t12 0"/>
    <path d="M4 23 q6 -5 12 0 t12 0"/>
  </g>
</svg>
