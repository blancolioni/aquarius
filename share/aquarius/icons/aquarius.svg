<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Aquarius">
  <title>Aquarius</title>
  <defs>
    <linearGradient id="aq-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf9ff"/>
      <stop offset="1" stop-color="#efeafc"/>
    </linearGradient>
    <linearGradient id="aq-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- rounded card background -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#aq-bg)"
        stroke="#e4dcfb" stroke-width="2"/>

  <!-- three wavy water lines (Aquarius glyph) -->
  <g fill="none" stroke="url(#aq-wave)" stroke-width="13"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 90 q22 -22 44 0 t44 0 t44 0 t44 0"/>
    <path d="M40 128 q22 -22 44 0 t44 0 t44 0 t44 0"/>
    <path d="M40 166 q22 -22 44 0 t44 0 t44 0 t44 0"/>
  </g>
</svg>
